<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OlympusOS — Crisis Intelligence Platform</title>
  <script>window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/';</script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #0a0e1a;
      --cyan:   #00d4ff;
      --orange: #ff6b35;
      --green:  #39ff14;
      --red:    #ff0033;
      --glass:  rgba(10,14,26,0.88);
    }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 1px,
        rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px
      );
    }

    #cesiumContainer { position: absolute; inset: 0; }

    .cesium-widget-credits,
    .cesium-credit-logoContainer { display: none !important; }

    /* ── TOP BAR ── */
    #topBar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px;
      background: rgba(10,14,26,0.92);
      border-bottom: 1px solid rgba(0,212,255,0.25);
      backdrop-filter: blur(10px);
    }

    #logo {
      font-size: 20px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase; color: var(--cyan);
    }
    #logo em { color: rgba(0,212,255,0.35); font-style: normal; font-weight: 300; }

    #statusWrap {
      display: flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 2px;
    }

    #statusDot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 8px var(--green);
      transition: background 0.5s, box-shadow 0.5s;
    }
    #statusDot.active   { background: var(--orange); box-shadow: 0 0 8px var(--orange); animation: blink 1s infinite; }
    #statusDot.resolved { background: var(--green);  box-shadow: 0 0 14px var(--green); animation: none; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

    #runBtn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; padding: 8px 20px;
      background: transparent; color: var(--cyan);
      border: 1px solid var(--cyan); border-radius: 4px;
      cursor: pointer; transition: background 0.2s, box-shadow 0.2s;
    }
    #runBtn:hover:not(:disabled) {
      background: rgba(0,212,255,0.1);
      box-shadow: 0 0 14px rgba(0,212,255,0.45);
    }
    #runBtn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ── METRICS HUD (top-right) ── */
    #metricsHUD {
      position: fixed; top: 60px; right: 18px; z-index: 400;
      background: var(--glass);
      border: 1px solid rgba(0,212,255,0.22); border-radius: 8px;
      padding: 14px 18px; min-width: 190px;
      backdrop-filter: blur(14px);
    }

    .mrow {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .mrow:last-child { border-bottom: none; }
    .mlbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    .mval { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; transition: color 1.2s; }
    .munit { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.35); margin-left: 2px; }
    .danger  { color: var(--orange); }
    .safe    { color: var(--green);  }
    .neutral { color: var(--cyan);   }

    /* ── CHAT PANEL (left side) ── */
    #chatPanel {
      position: fixed; top: 60px; left: 18px; z-index: 400;
      width: 340px; max-height: calc(100vh - 96px);
      background: var(--glass);
      border: 1px solid rgba(0,212,255,0.18); border-radius: 8px;
      backdrop-filter: blur(14px);
      display: flex; flex-direction: column; overflow: hidden;
    }

    #chatHdr {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      letter-spacing: 2px; color: var(--cyan); text-transform: uppercase;
      padding: 7px 12px; border-bottom: 1px solid rgba(0,212,255,0.12);
      flex-shrink: 0;
    }

    #chatBody {
      flex: 1; overflow-y: auto;
      padding: 6px 10px 10px;
      display: flex; flex-direction: column; gap: 5px;
    }
    #chatBody::-webkit-scrollbar { width: 3px; }
    #chatBody::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.25); border-radius: 2px; }

    .cmsg {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px; padding: 7px 9px;
      animation: msgIn 0.22s ease-out;
      flex-shrink: 0;
    }
    .cmsg.decision {
      border-color: rgba(255,215,0,0.45);
      background: rgba(255,215,0,0.05);
    }
    .cmsg.sysline {
      border-color: rgba(0,212,255,0.12);
      background: transparent;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cmsg-hdr {
      display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    }
    .cmsg-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cmsg-name { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; }
    .cmsg-time { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.28); margin-left: auto; }
    .cmsg-text { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.55; color: rgba(255,255,255,0.82); }
    .cmsg.decision .cmsg-text { color: rgba(255,215,0,0.92); }
    .cmsg.sysline  .cmsg-text { color: rgba(0,212,255,0.6); font-size: 9.5px; }

    /* ── TRANSCRIPT PANEL (bottom-right) ── */
    #txPanel {
      position: fixed; bottom: 18px; right: 18px; z-index: 400;
      width: 330px; max-height: 215px;
      background: var(--glass);
      border: 1px solid rgba(0,212,255,0.18); border-radius: 8px;
      backdrop-filter: blur(14px);
      display: none; flex-direction: column; overflow: hidden;
    }
    #txPanel.on {
      display: flex;
      animation: txGlow 2s ease-in-out infinite alternate;
    }
    @keyframes txGlow {
      0%   { border-color: rgba(0,212,255,0.18); box-shadow: none; }
      100% { border-color: rgba(0,212,255,0.85); box-shadow: 0 0 22px rgba(0,212,255,0.28); }
    }
    #txHdr {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      letter-spacing: 2px; color: var(--cyan);
      padding: 7px 12px; border-bottom: 1px solid rgba(0,212,255,0.12);
      display: flex; align-items: center; gap: 7px; flex-shrink: 0;
    }
    #txDot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); animation: blink 0.75s infinite;
    }
    #txBody {
      flex: 1; overflow-y: auto;
      padding: 9px 12px;
      font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
      line-height: 1.65; color: rgba(255,255,255,0.85); word-break: break-word;
    }
    #txBody::-webkit-scrollbar { width: 3px; }
    #txBody::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.25); border-radius: 2px; }

    /* ── AGENT ICONS (3D-anchored floating) ── */
    .aicon {
      position: fixed; z-index: 300;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; pointer-events: none;
      transform: translate(-50%,-50%);
      opacity: 0.3;
      transition: width .3s, height .3s, background .3s, box-shadow .3s, opacity .3s;
    }
    .aicon.lit {
      width: 60px; height: 60px;
      background: rgba(0,212,255,0.18);
      box-shadow: 0 0 18px rgba(0,212,255,0.85), 0 0 40px rgba(0,212,255,0.4);
      animation: iconPulse 1.1s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%,100% { box-shadow: 0 0 18px rgba(0,212,255,0.85), 0 0 40px rgba(0,212,255,0.4); }
      50%     { box-shadow: 0 0 28px rgba(0,212,255,1),    0 0 60px rgba(0,212,255,0.6); }
    }

    /* ── AGENT SPEECH BUBBLES ── */
    .abubble {
      position: fixed; z-index: 301;
      display: none;
      background: rgba(10,14,26,0.87);
      border: 2px solid var(--cyan); border-radius: 8px;
      padding: 11px 13px; max-width: 280px; min-width: 180px;
      pointer-events: none;
    }
    .abubble.on { display: block; }
    .abubble::after {
      content: ''; position: absolute;
      bottom: -11px; left: 18px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 11px solid var(--cyan);
    }
    .bh {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
      color: var(--cyan); margin-bottom: 5px;
    }
    .bm {
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
      color: rgba(255,255,255,0.88); line-height: 1.5; word-break: break-word;
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<!-- TOP BAR -->
<div id="topBar">
  <div id="logo">Olympus<em>OS</em></div>
  <div id="statusWrap">
    <div id="statusDot"></div>
    <span id="statusTxt">STANDBY</span>
  </div>
  <button id="runBtn">&#9654; RUN DEMO</button>
</div>

<!-- METRICS HUD -->
<div id="metricsHUD">
  <div class="mrow">
    <span class="mlbl">Crowd Risk</span>
    <span><span id="mRisk" class="mval neutral">&#8212;</span></span>
  </div>
  <div class="mrow">
    <span class="mlbl">Evacuation</span>
    <span><span id="mEvac" class="mval neutral">&#8212;</span><span class="munit" id="mEvacUnit"></span></span>
  </div>
  <div class="mrow">
    <span class="mlbl">Response</span>
    <span><span id="mResp" class="mval neutral">&#8212;</span></span>
  </div>
  <div class="mrow">
    <span class="mlbl">Buses</span>
    <span><span id="mBuses" class="mval neutral">0</span></span>
  </div>
</div>

<!-- CHAT PANEL -->
<div id="chatPanel">
  <div id="chatHdr">&#9679; Agent Feed &#8212; Live</div>
  <div id="chatBody"></div>
</div>

<!-- TRANSCRIPT PANEL -->
<div id="txPanel">
  <div id="txHdr"><div id="txDot"></div>LIVE TRANSCRIPT &#8212; EMERGENCY CALL</div>
  <div id="txBody"></div>
</div>

<!-- AGENT ICONS (positioned each frame via wgs84ToWindowCoordinates) -->
<div id="ai-perception"     class="aicon">&#128065;</div>
<div id="ai-forecast"       class="aicon">&#128302;</div>
<div id="ai-mobility"       class="aicon">&#128678;</div>
<div id="ai-transit"        class="aicon">&#128652;</div>
<div id="ai-safety"         class="aicon">&#128737;</div>
<div id="ai-communications" class="aicon">&#128226;</div>
<div id="ai-orchestrator"   class="aicon">&#129504;</div>

<!-- AGENT SPEECH BUBBLES -->
<div id="ab-perception" class="abubble">
  <div class="bh">&#128065; Perception</div>
  <div id="bm-perception" class="bm"></div>
</div>
<div id="ab-forecast" class="abubble">
  <div class="bh">&#128302; Forecast</div>
  <div id="bm-forecast" class="bm"></div>
</div>
<div id="ab-mobility" class="abubble">
  <div class="bh">&#128678; Mobility</div>
  <div id="bm-mobility" class="bm"></div>
</div>
<div id="ab-transit" class="abubble">
  <div class="bh">&#128652; Transit</div>
  <div id="bm-transit" class="bm"></div>
</div>
<div id="ab-safety" class="abubble">
  <div class="bh">&#128737; Safety</div>
  <div id="bm-safety" class="bm"></div>
</div>
<div id="ab-communications" class="abubble">
  <div class="bh">&#128226; Communications</div>
  <div id="bm-communications" class="bm"></div>
</div>
<div id="ab-orchestrator" class="abubble">
  <div class="bh">&#129504; Orchestrator</div>
  <div id="bm-orchestrator" class="bm"></div>
</div>

<script>
'use strict';

// ═══ AGENT REGISTRY (colors, emojis, names, 3D anchor positions) ═══
const AGENTS = {
  perception:     { lon: 9.12480, lat: 45.47880, alt: 5,   color: '#FF9900', name: 'Perception',     freq: 440 },
  forecast:       { lon: 9.14090, lat: 45.48560, alt: 5,   color: '#FF6600', name: 'Forecast',       freq: 523 },
  mobility:       { lon: 9.13000, lat: 45.47700, alt: 5,   color: '#4CAF50', name: 'Mobility',       freq: 587 },
  transit:        { lon: 9.11500, lat: 45.49100, alt: 5,   color: '#2196F3', name: 'Transit',        freq: 659 },
  safety:         { lon: 9.12430, lat: 45.48200, alt: 5,   color: '#F44336', name: 'Safety',         freq: 698 },
  communications: { lon: 9.12400, lat: 45.47810, alt: 5,   color: '#9C27B0', name: 'Communications', freq: 783 },
  orchestrator:   { lon: 9.12400, lat: 45.47810, alt: 250, color: '#FFD700', name: 'Orchestrator',   freq: 880 }
};

// Pre-compute ECEF Cartesian3 for each agent's 3D anchor
const agentPos = {};
Object.entries(AGENTS).forEach(([k, a]) => {
  agentPos[k] = Cesium.Cartesian3.fromDegrees(a.lon, a.lat, a.alt);
});

// Named map coordinates
const GATE4      = { lon: 9.12480, lat: 45.47880 };
const BUS_DEPOT  = { lon: 9.11500, lat: 45.49100 };
const NORTH_GATE = { lon: 9.12430, lat: 45.48200 };

// ═══ DEMO STATE ═══
let scenario       = null;
let tickIntervalId = null;
let demoStartTime  = null;
let firedSet       = new Set();
let metroFailed    = false;
let audioCtx       = null;
let idleFlyTimer   = null;

// Cesium primitive handles (allocated lazily, reused across runs)
let pedColl  = null;
let busColl  = null;
let ambColl  = null;
let pedestrians = [];
let busState    = [];
let ambState    = [];
let busAnimIv   = null;
let ambAnimIv   = null;
let lastPedTick = 0;

// Entity / billboard handles that must be cleaned between runs
let corridorEntities = [];
let congestionEntity = null;
let alertBillColls   = [];
let alertIntervals   = [];

// ═══ CESIUM SETUP ═══
const viewer = new Cesium.Viewer('cesiumContainer', {
  timeline:             false,
  animation:            false,
  baseLayerPicker:      false,
  geocoder:             false,
  homeButton:           false,
  sceneModePicker:      false,
  navigationHelpButton: false,
  fullscreenButton:     false,
  infoBox:              false,
  selectionIndicator:   false,
  terrainProvider:      new Cesium.EllipsoidTerrainProvider()
});

viewer.imageryLayers.removeAll();
viewer.scene.globe.show             = false;
viewer.scene.backgroundColor        = new Cesium.Color(0.039, 0.055, 0.102, 1.0);
viewer.scene.skyAtmosphere.show     = false;
viewer.scene.screenSpaceCameraController.enableInputs = false;

Cesium.Ion.defaultAccessToken = '__CESIUM_ION_TOKEN__';

// Google Photorealistic 3D Tiles — KEY as positional string (Cesium 1.114)
(async () => {
  try {
    const ts = await Cesium.createGooglePhotorealistic3DTileset('__GOOGLE_MAPS_API_KEY__');
    viewer.scene.primitives.add(ts);
    chatSys('Google 3D Tiles loaded');
  } catch (e) {
    chatSys('3D Tiles: ' + (e.message || 'load error'));
  }
})();

// Initial camera — wide aerial over San Siro
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(9.1240, 45.4781, 850),
  orientation: {
    heading: Cesium.Math.toRadians(35),
    pitch:   Cesium.Math.toRadians(-42),
    roll:    0.0
  }
});

// Idle drift before demo starts
idleFlyTimer = setTimeout(() => {
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(9.1240, 45.4775, 900),
    orientation: {
      heading: Cesium.Math.toRadians(35),
      pitch:   Cesium.Math.toRadians(-45),
      roll:    0.0
    },
    duration: 4
  });
}, 3000);

// ═══ METRO M5 LINE (always visible, turns red on METRO_FAILURE) ═══
const M5_POS = Cesium.Cartesian3.fromDegreesArray([
  9.12380, 45.47830,
  9.13250, 45.48200,
  9.14090, 45.48560
]);

viewer.entities.add({
  polyline: {
    positions: M5_POS,
    width: new Cesium.CallbackProperty(() => metroFailed ? 6 : 4, false),
    material: new Cesium.ColorMaterialProperty(
      new Cesium.CallbackProperty(() => {
        if (!metroFailed) return Cesium.Color.fromCssColorString('#39ff14');
        const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(Date.now() / 290));
        return new Cesium.Color(1, 0, 0.2, a);
      }, false)
    ),
    clampToGround: true
  }
});

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(9.1335, 45.4820, 60),
  label: {
    text: new Cesium.CallbackProperty(() => metroFailed ? 'M5 SUSPENDED' : 'M5', false),
    font: '13px "Space Grotesk", sans-serif',
    fillColor: new Cesium.CallbackProperty(
      () => metroFailed
        ? Cesium.Color.fromCssColorString('#ff0033')
        : Cesium.Color.fromCssColorString('#39ff14'),
      false
    ),
    outlineColor: Cesium.Color.BLACK,
    outlineWidth: 2,
    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
    disableDepthTestDistance: Number.POSITIVE_INFINITY
  }
});

// ═══ POST-RENDER: pedestrian animation + icon 3D→2D projection ═══
viewer.scene.postRender.addEventListener(() => {
  const now = performance.now();

  // Animate pedestrians at ~10 Hz
  if (pedColl && now - lastPedTick > 100) {
    lastPedTick = now;
    pedestrians.forEach(p => {
      p.lng += p.dlng + (Math.random() - 0.5) * 0.0000007;
      p.lat += p.dlat + (Math.random() - 0.5) * 0.0000007;
      p.pt.position = Cesium.Cartesian3.fromDegrees(p.lng, p.lat, 5);
    });
  }

  // Position agent icons using Cesium 1.114: wgs84ToWindowCoordinates
  Object.keys(AGENTS).forEach(k => {
    const wp     = Cesium.SceneTransforms.wgs84ToWindowCoordinates(viewer.scene, agentPos[k]);
    const icon   = document.getElementById('ai-' + k);
    const bubble = document.getElementById('ab-' + k);
    const inView = wp && wp.x >= 0 && wp.y >= 0 && wp.x <= window.innerWidth && wp.y <= window.innerHeight;

    if (!inView) {
      if (icon)   icon.style.display   = 'none';
      if (bubble) bubble.style.display = 'none';
      return;
    }
    if (icon) {
      icon.style.display = 'flex';
      icon.style.left    = wp.x + 'px';
      icon.style.top     = wp.y + 'px';
    }
    if (bubble && bubble.classList.contains('on')) {
      bubble.style.display = 'block';
      bubble.style.left = Math.min(wp.x + 28, window.innerWidth  - 295) + 'px';
      bubble.style.top  = Math.max(wp.y - 135, 68) + 'px';
    }
  });
});

// ═══ WEB AUDIO ═══
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function beep(freq, dur) {
  dur = dur || 0.18;
  try {
    const ctx  = getACtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.01);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch (_) {}
}

// ═══ CANVAS HELPERS ═══
function makeRingCanvas(radius, strokeColor) {
  const size = radius * 2 + 8;
  const c    = document.createElement('canvas');
  c.width    = c.height = size;
  const ctx  = c.getContext('2d');
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, radius, 0, Math.PI * 2);
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth   = 4;
  ctx.stroke();
  return c;
}

// ═══ CHAT PANEL ENGINE ═══
function chatSys(msg) {
  const body = document.getElementById('chatBody');
  const now  = new Date();
  const ts   = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const div  = document.createElement('div');
  div.className = 'cmsg sysline';
  div.innerHTML =
    '<div class="cmsg-hdr">' +
    '<span class="cmsg-dot" style="background:rgba(0,212,255,0.5)"></span>' +
    '<span class="cmsg-name" style="color:rgba(0,212,255,0.7)">SYS</span>' +
    '<span class="cmsg-time">' + ts + '</span>' +
    '</div>' +
    '<div class="cmsg-text">' + esc(msg) + '</div>';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function appendAgentMsg(key, agent, text, decision, elapsedSec) {
  const body = document.getElementById('chatBody');
  const div  = document.createElement('div');
  div.className = 'cmsg' + (decision ? ' decision' : '');
  div.innerHTML =
    '<div class="cmsg-hdr">' +
    '<span class="cmsg-dot" style="background:' + agent.color + '"></span>' +
    '<span class="cmsg-name" style="color:' + agent.color + '">' + esc(agent.name) + '</span>' +
    '<span class="cmsg-time">T+' + elapsedSec.toFixed(1) + 's</span>' +
    '</div>' +
    '<div class="cmsg-text">' + esc(text) + '</div>';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

// ═══ ICON / BUBBLE HELPERS ═══
function lightIcon(key) {
  const el = document.getElementById('ai-' + key);
  if (!el) return;
  el.style.opacity = '1';
  el.classList.add('lit');
  setTimeout(() => { el.style.opacity = '0.3'; el.classList.remove('lit'); }, 8500);
}

function showBubble(key, text) {
  const b   = document.getElementById('ab-' + key);
  const msg = document.getElementById('bm-' + key);
  if (b)   { b.style.opacity = '1'; b.classList.add('on'); }
  if (msg) typewrite(msg, text.substring(0, 200), 26);
  setTimeout(() => {
    if (!b) return;
    b.style.transition = 'opacity 0.4s';
    b.style.opacity    = '0';
    setTimeout(() => { b.classList.remove('on'); b.style.opacity = ''; b.style.transition = ''; }, 420);
  }, 9000);
}

function hideAllBubbles() {
  Object.keys(AGENTS).forEach(k => {
    const b = document.getElementById('ab-' + k);
    if (b) { b.classList.remove('on'); b.style.opacity = ''; b.style.transition = ''; }
  });
}

function dimAllIcons() {
  Object.keys(AGENTS).forEach(k => {
    const el = document.getElementById('ai-' + k);
    if (el) { el.style.opacity = '0.3'; el.classList.remove('lit'); }
  });
}

// ═══ STATUS ═══
function setStatus(s) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusTxt');
  dot.className = '';
  if (s === 'active')   { dot.classList.add('active');   txt.textContent = 'ACTIVE'; }
  else if (s === 'resolved') { dot.classList.add('resolved'); txt.textContent = 'RESOLVED'; }
  else                  { txt.textContent = 'STANDBY'; }
}

// ═══ METRIC HELPERS ═══
function setVal(id, val, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = val;
  el.className   = 'mval ' + (cls || 'neutral');
}

function countUp(id, target, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  const from  = parseFloat(el.textContent) || 0;
  const steps = 30;
  const inc   = (target - from) / steps;
  let cur = from, step = 0;
  const iv = setInterval(() => {
    cur += inc; step++;
    el.textContent = Math.round(cur);
    if (step >= steps) { el.textContent = target; clearInterval(iv); }
  }, 50);
  if (cls) el.className = 'mval ' + cls;
}

// ═══ TYPEWRITER ═══
function typewrite(el, text, ms) {
  el.textContent = '';
  let i = 0;
  const iv = setInterval(() => {
    if (i >= text.length) { clearInterval(iv); return; }
    el.textContent += text[i++];
  }, ms);
}

function pad(n)  { return String(n).padStart(2, '0'); }
function esc(s)  { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ═══ CESIUM ACTION HANDLERS ═══

function handleCameraFly(ev) {
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(ev.lon, ev.lat, ev.alt),
    orientation: {
      heading: Cesium.Math.toRadians(ev.heading || 0),
      pitch:   Cesium.Math.toRadians(ev.pitch   || -45),
      roll:    0.0
    },
    duration: ev.duration || 2.5
  });
}

function handleCameraAlert(ev) {
  const pos  = Cesium.Cartesian3.fromDegrees(ev.lon, ev.lat, 10);
  const coll = viewer.scene.primitives.add(new Cesium.BillboardCollection());
  const img  = makeRingCanvas(28, '#ff2952');
  const bill = coll.add({
    position: pos,
    image:    img,
    disableDepthTestDistance: Number.POSITIVE_INFINITY,
    color:    Cesium.Color.fromCssColorString('#ff2952')
  });
  // Pulse at 1.5 Hz
  const iv = setInterval(() => {
    const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(Date.now() * Math.PI / 333));
    bill.color  = new Cesium.Color(1, 0.16, 0.32, alpha);
  }, 33);
  alertBillColls.push(coll);
  alertIntervals.push(iv);
}

function initPedestrians() {
  if (!pedColl) pedColl = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
  pedColl.removeAll();
  pedestrians = [];
  for (let i = 0; i < 80; i++) {
    const ang   = Math.random() * Math.PI * 2;
    const rad   = 0.0003 + Math.random() * 0.0015;
    const lng   = GATE4.lon + Math.cos(ang) * rad * 1.8;
    const lat   = GATE4.lat + Math.sin(ang) * rad;
    const speed = 0.000003 + Math.random() * 0.000004;
    const pt    = pedColl.add({
      position: Cesium.Cartesian3.fromDegrees(lng, lat, 5),
      color:    Cesium.Color.fromCssColorString('#ff7a3d'),
      pixelSize: 12,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    });
    pedestrians.push({
      pt, lng, lat,
      dlng: Math.cos(ang) * speed * 0.3,
      dlat: Math.sin(ang) * speed * 0.3,
      redirected: false
    });
  }
}

function handleCrowdDensityIncrease(ev) {
  const intensity = ev.intensity || 0.5;
  // Color lerp: #ff7a3d (orange) → #ff2952 (red) based on intensity
  const g = 0.478 - (0.478 - 0.161) * intensity;
  const b = 0.239 + (0.322 - 0.239) * intensity;
  const col = new Cesium.Color(1.0, g, b, 1.0);

  pedestrians.forEach(p => {
    if (!p.redirected) {
      p.pt.color    = col;
      p.pt.pixelSize = 10 + Math.round(intensity * 4);
      // Slow to near-standstill — trapped crowd
      p.dlng = (Math.random() - 0.5) * 0.0000005;
      p.dlat = (Math.random() - 0.5) * 0.0000005;
    }
  });

  // Spawn red dome at gate when density is high
  if (intensity >= 0.6) {
    if (congestionEntity) viewer.entities.remove(congestionEntity);
    congestionEntity = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(GATE4.lon, GATE4.lat, 0),
      ellipse: {
        semiMajorAxis:  new Cesium.CallbackProperty(() => 40 + 4 * Math.sin(Date.now() / 400), false),
        semiMinorAxis:  new Cesium.CallbackProperty(() => 40 + 4 * Math.sin(Date.now() / 400), false),
        material:       Cesium.Color.RED.withAlpha(0.35),
        height:         0,
        extrudedHeight: 30
      }
    });
  }
}

function handleRouteOpened(ev) {
  const positions = Cesium.Cartesian3.fromDegreesArray([
    9.12400, 45.47810,
    9.12450, 45.48550
  ]);
  // Outer halo 20px alpha 0.4 + inner solid 8px alpha 1.0
  const halo = viewer.entities.add({
    polyline: {
      positions,
      width:    20,
      material: new Cesium.ColorMaterialProperty(
        Cesium.Color.fromCssColorString('#00ff88').withAlpha(0.4)
      ),
      clampToGround: true
    }
  });
  const line = viewer.entities.add({
    polyline: {
      positions,
      width:    8,
      material: new Cesium.ColorMaterialProperty(
        Cesium.Color.fromCssColorString('#00ff88')
      ),
      clampToGround: true
    }
  });
  corridorEntities.push(halo, line);
}

function handleCrowdRedirect(ev) {
  const tLon = 9.12450, tLat = 45.48550;
  pedestrians.forEach(p => {
    if (!p.redirected) {
      p.redirected = true;
      // Stagger departure for organic look
      const delay = Math.random() * 2000;
      setTimeout(() => {
        p.dlng = (tLon - p.lng) * 0.000025 + (Math.random() - 0.5) * 0.0000012;
        p.dlat = (tLat - p.lat) * 0.000025 + (Math.random() - 0.5) * 0.0000012;
        p.pt.color    = Cesium.Color.fromCssColorString('#00ff88');
        p.pt.pixelSize = 10;
      }, delay);
    }
  });
}

function handleBusDeploy(ev) {
  const count = ev.count || 30;
  if (!busColl) busColl = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
  busColl.removeAll();
  busState = [];

  for (let i = 0; i < count; i++) {
    const jLon = (Math.random() - 0.5) * 0.004;
    const jLat = (Math.random() - 0.5) * 0.004;
    const tLon = NORTH_GATE.lon + (Math.random() - 0.5) * 0.001;
    const tLat = NORTH_GATE.lat + (Math.random() - 0.5) * 0.001;
    const pt   = busColl.add({
      position: Cesium.Cartesian3.fromDegrees(BUS_DEPOT.lon + jLon, BUS_DEPOT.lat + jLat, 5),
      color:    Cesium.Color.fromCssColorString('#00d4ff'),
      pixelSize: 14,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    });
    busState.push({
      pt,
      sLon: BUS_DEPOT.lon + jLon, sLat: BUS_DEPOT.lat + jLat,
      tLon, tLat,
      offset: Math.random() * 0.1
    });
  }

  const t0 = performance.now();
  if (busAnimIv) clearInterval(busAnimIv);
  busAnimIv = setInterval(() => {
    const elapsed = (performance.now() - t0) / 25000;
    busState.forEach(b => {
      const prog = Math.min(elapsed + b.offset, 1.0);
      b.pt.position = Cesium.Cartesian3.fromDegrees(
        b.sLon + (b.tLon - b.sLon) * prog,
        b.sLat + (b.tLat - b.sLat) * prog,
        5
      );
    });
  }, 16);
}

function handleAmbulanceDeploy(ev) {
  const starts = [
    { lon: 9.1235, lat: 45.4742 },
    { lon: 9.1246, lat: 45.4738 }
  ];
  if (!ambColl) ambColl = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());
  ambColl.removeAll();
  ambState = [];

  const count = Math.min(ev.count || 2, starts.length);
  for (let i = 0; i < count; i++) {
    const s  = starts[i];
    const pt = ambColl.add({
      position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, 5),
      color:    Cesium.Color.fromCssColorString('#ff2952'),
      pixelSize: 16,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    });
    ambState.push({ pt, sLon: s.lon, sLat: s.lat, tLon: NORTH_GATE.lon, tLat: NORTH_GATE.lat });
  }

  const t0 = performance.now();
  if (ambAnimIv) clearInterval(ambAnimIv);
  ambAnimIv = setInterval(() => {
    const prog  = Math.min((performance.now() - t0) / 9000, 1.0);
    const flash = Math.sin(Date.now() / 170) > 0;
    ambState.forEach(a => {
      a.pt.position = Cesium.Cartesian3.fromDegrees(
        a.sLon + (a.tLon - a.sLon) * prog,
        a.sLat + (a.tLat - a.sLat) * prog,
        5
      );
      a.pt.color    = flash ? Cesium.Color.WHITE : Cesium.Color.fromCssColorString('#ff2952');
      a.pt.pixelSize = flash ? 11 : 16;
    });
  }, 16);
}

function handleMetroFailure(ev) {
  metroFailed = true;
  beep(220, 0.5);
}

function handleMetricUpdate(ev) {
  const clsMap = { orange: 'danger', green: 'safe', cyan: 'neutral' };
  const cls    = clsMap[ev.color] || 'neutral';

  switch (ev.metric) {
    case 'risk':
      setVal('mRisk', ev.value, cls);
      break;
    case 'evac': {
      const num = ev.value.replace('min', '').trim();
      setVal('mEvac', num, cls);
      document.getElementById('mEvacUnit').textContent = 'min';
      break;
    }
    case 'buses':
      countUp('mBuses', parseInt(ev.value, 10), cls);
      break;
    case 'response':
      setVal('mResp', ev.value, cls);
      break;
  }
}

function handleTranscriptStream(ev) {
  const panel = document.getElementById('txPanel');
  panel.classList.add('on');
  const body  = document.getElementById('txBody');
  body.textContent = '';
  const words  = ev.text.split(/\s+/);
  let i = 0;
  const iv = setInterval(() => {
    if (i >= words.length) { clearInterval(iv); return; }
    body.textContent += (i > 0 ? ' ' : '') + words[i++];
    body.scrollTop    = body.scrollHeight;
  }, 200);
}

function handleIncidentResolved(ev) {
  setStatus('resolved');
  // Crowd dots → green
  pedestrians.forEach(p => {
    p.pt.color    = Cesium.Color.fromCssColorString('#00ff88');
    p.pt.pixelSize = 9;
    p.dlng = (Math.random() - 0.5) * 0.000002;
    p.dlat = 0.000003 + Math.random() * 0.000002;
  });
  // Congestion dome → green
  if (congestionEntity && congestionEntity.ellipse) {
    congestionEntity.ellipse.material = Cesium.Color.fromCssColorString('#00ff88').withAlpha(0.35);
  }
}

function handleAgentMessage(ev) {
  const agent = AGENTS[ev.agent];
  if (!agent) return;
  const elapsed = demoStartTime ? (performance.now() - demoStartTime) / 1000 : 0;
  beep(agent.freq);
  appendAgentMsg(ev.agent, agent, ev.text, ev.decision, elapsed);
  lightIcon(ev.agent);
  showBubble(ev.agent, ev.text);
}

// ═══ TIMELINE ENGINE ═══
function dispatchScenarioEvent(ev) {
  switch (ev.type) {
    case 'CAMERA_FLY':             handleCameraFly(ev);             break;
    case 'CAMERA_ALERT':           handleCameraAlert(ev);           break;
    case 'AGENT_MESSAGE':          handleAgentMessage(ev);          break;
    case 'CROWD_DENSITY_INCREASE': handleCrowdDensityIncrease(ev);  break;
    case 'ROUTE_OPENED':           handleRouteOpened(ev);           break;
    case 'CROWD_REDIRECT':         handleCrowdRedirect(ev);         break;
    case 'BUS_DEPLOY':             handleBusDeploy(ev);             break;
    case 'AMBULANCE_DEPLOY':       handleAmbulanceDeploy(ev);       break;
    case 'METRO_FAILURE':          handleMetroFailure(ev);          break;
    case 'METRIC_UPDATE':          handleMetricUpdate(ev);          break;
    case 'TRANSCRIPT_STREAM':      handleTranscriptStream(ev);      break;
    case 'INCIDENT_RESOLVED':      handleIncidentResolved(ev);      break;
  }
}

function tick() {
  if (!scenario) return;
  const elapsed = (performance.now() - demoStartTime) / 1000;
  scenario.events.forEach((ev, i) => {
    if (!firedSet.has(i) && ev.t <= elapsed) {
      firedSet.add(i);
      dispatchScenarioEvent(ev);
    }
  });
  if (elapsed >= scenario.duration) {
    clearInterval(tickIntervalId);
    tickIntervalId = null;
    onDemoEnd();
  }
}

function startTick() {
  demoStartTime = performance.now();
  firedSet.clear();
  if (tickIntervalId) clearInterval(tickIntervalId);
  tickIntervalId = setInterval(tick, 100);
}

function onDemoEnd() {
  const btn = document.getElementById('runBtn');
  btn.textContent = '↺ RUN AGAIN';
  btn.disabled    = false;
}

// ═══ DEMO CONTROL ═══
function resetAll() {
  if (tickIntervalId) { clearInterval(tickIntervalId); tickIntervalId = null; }
  firedSet.clear();
  metroFailed = false;

  // Clear point primitive collections
  if (pedColl) pedColl.removeAll();
  if (busColl) busColl.removeAll();
  if (ambColl) ambColl.removeAll();
  if (busAnimIv) { clearInterval(busAnimIv); busAnimIv = null; }
  if (ambAnimIv) { clearInterval(ambAnimIv); ambAnimIv = null; }
  pedestrians = []; busState = []; ambState = [];

  // Remove camera alert billboards
  alertBillColls.forEach(c => { try { viewer.scene.primitives.remove(c); } catch (_) {} });
  alertBillColls = [];
  alertIntervals.forEach(iv => clearInterval(iv));
  alertIntervals = [];

  // Remove corridor polylines
  corridorEntities.forEach(e => { try { viewer.entities.remove(e); } catch (_) {} });
  corridorEntities = [];

  // Remove gate congestion dome
  if (congestionEntity) { try { viewer.entities.remove(congestionEntity); } catch (_) {} congestionEntity = null; }

  // Reset UI panels
  document.getElementById('chatBody').innerHTML = '';
  document.getElementById('txPanel').classList.remove('on');
  document.getElementById('txBody').textContent = '';
  hideAllBubbles();
  dimAllIcons();
  setStatus('standby');

  // Reset metrics to initial state
  setVal('mRisk',  '—', 'neutral');
  setVal('mEvac',  '—', 'neutral');
  setVal('mResp',  '—', 'neutral');
  setVal('mBuses', '0',      'neutral');
  document.getElementById('mEvacUnit').textContent = '';
}

document.getElementById('runBtn').addEventListener('click', () => {
  getACtx();
  if (idleFlyTimer) { clearTimeout(idleFlyTimer); idleFlyTimer = null; }
  resetAll();

  const btn = document.getElementById('runBtn');
  btn.textContent = '● RUNNING';
  btn.disabled    = true;

  if (!scenario) {
    chatSys('Error: scenario.json not loaded');
    btn.textContent = '► RUN DEMO';
    btn.disabled    = false;
    return;
  }

  setStatus('active');
  initPedestrians();
  chatSys('OlympusOS crisis scenario initiated — 90s simulation');
  startTick();
});

// ═══ STARTUP ═══
chatSys('OlympusOS v2.0 — Crisis Intelligence Platform');
chatSys('San Siro Stadium, Milan — 75,000 capacity event');

fetch('scenario.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    scenario = data;
    chatSys('Scenario loaded: ' + scenario.events.length + ' events / ' + scenario.duration + 's');
  })
  .catch(e => chatSys('Scenario load error: ' + e.message));
</script>
