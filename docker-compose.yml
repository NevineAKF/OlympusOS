services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus_pass
      POSTGRES_DB: olympusos
    volumes:
      - postgres_data:/var/lib/postgresql/data

  streamlit:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_data:
